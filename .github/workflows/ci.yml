name: FileToolkit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-rust-core:
    name: Run Rust Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Tests
        working-directory: rust_core
        run: cargo test --verbose

  build-android-app:
    name: Build Android APK & Native Binaries
    runs-on: ubuntu-latest
    needs: test-rust-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Configure Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            LATEST_NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
            echo "Using NDK: $LATEST_NDK"
            echo "ANDROID_NDK_HOME=$LATEST_NDK" >> $GITHUB_ENV
            echo "NDK_HOME=$LATEST_NDK" >> $GITHUB_ENV
          else
            echo "NDK directory not found in $ANDROID_HOME/ndk, searching..."
            find $ANDROID_HOME -name "ndk-build" || true
          fi

      - name: Compile Rust Core for Android (cargo-ndk)
        working-directory: rust_core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filetoolkit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
