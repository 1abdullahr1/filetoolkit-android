[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
description = "Native Rust processing core for All-in-One File Toolkit"
authors = ["FileToolkit Team"]

[lib]
name = "rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
lopdf = "0.33"
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.10"
